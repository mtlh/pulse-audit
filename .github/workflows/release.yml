name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: write
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          cache: npm

      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

      - name: Read version and check npm
        id: version
        run: |
          VERSION=$(node -p "require('./package.json').version")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          if npm view "@mtlh/pulse-audit@$VERSION" version --prefer-online >/dev/null 2>&1; then
            echo "published=true" >> "$GITHUB_OUTPUT"
            echo "@mtlh/pulse-audit@$VERSION is already on npm; skipping publish."
          else
            echo "published=false" >> "$GITHUB_OUTPUT"
            echo "@mtlh/pulse-audit@$VERSION is not on npm; releasing."
          fi

      - name: Publish to npm
        if: steps.version.outputs.published == 'false'
        run: npm publish --access public --provenance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Wait for the registry
        if: steps.version.outputs.published == 'false'
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          for attempt in $(seq 1 18); do
            if npm view "@mtlh/pulse-audit@$VERSION" version --prefer-online >/dev/null 2>&1; then
              echo "@mtlh/pulse-audit@$VERSION is live."
              exit 0
            fi
            echo "attempt $attempt: not visible yet"
            sleep 10
          done
          echo "::error::Publish was accepted but the version is not visible. If npm staged it for review, approve it on npmjs.com and re-run this workflow."
          exit 1

      - name: Tag and create GitHub release
        if: steps.version.outputs.published == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if ! git rev-parse "v$VERSION" >/dev/null 2>&1; then
            git tag -a "v$VERSION" -m "@mtlh/pulse-audit v$VERSION"
            git push origin "v$VERSION"
          fi
          if ! gh release view "v$VERSION" >/dev/null 2>&1; then
            gh release create "v$VERSION" --generate-notes --title "v$VERSION"
          fi
